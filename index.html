<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>만에 하나</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column that sinks through the ocean zones; the water darkens as you dive. Single deep-sea theme by design. */
@property --d { syntax: '<number>'; inherits: true; initial-value: 0; }
:root{
  --surface:#0f3d56;
  --abyss:#02070d;
  --ink:#dbe9f0;
  --ink-dim:#88a3b2;
  --line:rgba(150,205,228,.16);
  --panel:rgba(6,22,34,.6);
  --glow:#7fdff3;
  --lure:#f7c548;
  --snow:#cfeef6;
  --z1:#a4aeb6; --z2:#5aa8f0; --z3:#f2616a; --z4:#a47ef0; --z5:#f7c548;
  --miss:#5a7381;
  --bad:#ffa27a;
  --f-display:"Hahmlet","Nanum Myeongjo","AppleMyungjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  word-break:keep-all;
  overflow-wrap:break-word;
  min-height:100%;
  background-color:var(--abyss);
  background-image:linear-gradient(180deg,
    color-mix(in oklab, var(--surface) calc((1 - var(--d)) * 100%), var(--abyss)) 0%,
    var(--abyss) 92%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  transition:--d 1.4s ease;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{
  position:relative;z-index:1;
  max-width:600px;margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 72px;
  display:flex;flex-direction:column;gap:28px;
}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 22px;border-radius:999px;border:1px solid var(--glow);
  background:color-mix(in oklab, var(--glow) 14%, transparent);color:var(--ink);
  font-weight:600;font-size:16px;
  transition:background .2s, box-shadow .2s;
}
.btn:hover{background:color-mix(in oklab, var(--glow) 24%, transparent);box-shadow:0 0 24px color-mix(in oklab, var(--glow) 30%, transparent)}
.btn:focus-visible,.link:focus-visible,.brand:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
.link{background:none;border:0;color:var(--ink-dim);text-decoration:underline;text-underline-offset:4px;padding:6px 2px;font-size:14px}
.link:hover{color:var(--ink)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}

/* intro */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(60px, 17vw, 112px);line-height:1;margin:0;letter-spacing:-.03em;
  background:linear-gradient(180deg, var(--ink) 30%, color-mix(in oklab, var(--glow) 60%, var(--ink)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-family:var(--f-display);font-size:20px;text-wrap:balance;font-weight:600;color:var(--lure);margin:0;text-shadow:0 0 22px color-mix(in oklab, var(--lure) 45%, transparent)}
.lede{font-size:17px;max-width:34em;margin:0;text-wrap:pretty}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--ink-dim);font-size:15px}
.rules li{display:flex;gap:10px}
.rules li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--glow);margin-top:.7em;box-shadow:0 0 8px var(--glow)}
.zonescale{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.zrow{display:grid;grid-template-columns:10px 1fr auto auto;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.zrow .sw{width:10px;align-self:stretch;border-radius:2px;background:var(--c)}
.zrow .zn{font-family:var(--f-display);font-weight:600;font-size:17px;color:var(--c)}
.zrow .zr{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.zrow .zp{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:4.5ch;text-align:right}
.zrow .zn small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;margin-left:8px;font-weight:400}
.zrow.gem .zn{text-shadow:0 0 16px color-mix(in oklab, var(--lure) 55%, transparent)}
.example{font-size:14px;color:var(--ink-dim);margin:0}
.example b{font-weight:500}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px}

/* play */
.hud{display:flex;justify-content:space-between;align-items:center;gap:16px}
.steps{display:flex;gap:5px;flex:1;max-width:260px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.steps i.now{background:color-mix(in oklab, var(--glow) 55%, transparent);box-shadow:0 0 8px color-mix(in oklab, var(--glow) 40%, transparent)}
.steps i.t0{background:var(--miss)} .steps i.t1{background:var(--z1)} .steps i.t2{background:var(--z2)} .steps i.t3{background:var(--z3)}
.steps i.t4{background:var(--z4)} .steps i.t5{background:var(--z5)}
.depth{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-dim);white-space:nowrap}
.depth b{color:var(--ink);font-weight:500;font-size:18px}
.qwrap{display:flex;flex-direction:column;gap:6px}
.qno{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--ink-dim)}
.prompt{font-family:var(--f-display);font-weight:600;font-size:clamp(25px, 6vw, 34px);line-height:1.3;margin:0;text-wrap:balance}
.hint{margin:0;color:var(--ink-dim);font-size:14px}
.timer{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--glow);transform-origin:left;box-shadow:0 0 10px var(--glow)}
.timer.low i{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.guess{display:flex;gap:10px;align-items:stretch}
.guess input{
  flex:1;min-width:0;font:inherit;font-size:20px;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
}
.guess input::placeholder{color:var(--ink-dim)}
.guess input:disabled{opacity:.55}
.guess .btn{padding-inline:18px;flex:none}
.guess .btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.msg{min-height:1.6em;margin:0;font-size:14px;color:var(--ink-dim)}
.msg.bad{color:var(--bad)}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.reveal{display:flex;flex-direction:column;gap:18px;padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;border:1px solid var(--c);color:var(--c);
  background:color-mix(in oklab, var(--c) 14%, transparent);font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.pts{font-family:var(--f-mono);font-size:14px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.yours{margin:0;font-size:16px}
.yours strong{font-family:var(--f-display);font-size:22px;font-weight:600}
.yours .note{display:block;font-size:13px;color:var(--ink-dim)}
.gembox{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.gembox .gl{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--lure)}
.gembox strong{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--lure);text-shadow:0 0 18px color-mix(in oklab, var(--lure) 50%, transparent)}
.reveal.is-gem{border-color:var(--lure);box-shadow:0 0 40px color-mix(in oklab, var(--lure) 22%, transparent)}
.reveal.is-gem .gembox strong{animation:lure 1.8s ease-in-out infinite}
@keyframes lure{50%{text-shadow:0 0 34px var(--lure)}}
.others{display:flex;flex-direction:column;gap:8px}
.others .eyebrow{font-size:11px}
.orow{display:grid;grid-template-columns:5.6em 1fr;gap:10px;font-size:14px;align-items:baseline}
.orow .on{font-family:var(--f-display);font-weight:600;color:var(--c)}
.orow .ol{color:var(--ink-dim);min-width:0}
.orow .ol mark{background:none;color:var(--ink);text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}

/* done */
.result{display:flex;flex-direction:column;gap:4px}
.bigdepth{font-family:var(--f-display);font-weight:800;font-size:clamp(56px, 16vw, 92px);line-height:1;letter-spacing:-.02em;margin:0;font-variant-numeric:tabular-nums}
.bigdepth small{font-size:.38em;font-weight:600;color:var(--ink-dim);margin-left:.15em}
.sub{margin:0;color:var(--ink-dim);font-size:15px;font-variant-numeric:tabular-nums}
.trench{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}
.trench i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--z1),var(--z3),var(--z5));border-radius:4px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.rrow .rl{font-size:13px;color:var(--ink-dim)}
.rrow .ra{font-family:var(--f-display);font-size:18px;font-weight:600}
.rrow .rp{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;min-width:3.5ch;text-align:right}
.rrow .rtxt{min-width:0;display:flex;flex-direction:column}
.share{display:flex;flex-direction:column;gap:10px}
.share pre{margin:0;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono);font-size:15px;line-height:1.6;white-space:pre-wrap;overflow-x:auto;user-select:all}
.countdown{font-family:var(--f-mono);font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;margin:0}

.z1{--c:var(--z1)} .z2{--c:var(--z2)} .z3{--c:var(--z3)} .z4{--c:var(--z4)} .z5{--c:var(--z5)} .z0{--c:var(--miss)}

@media (prefers-reduced-motion: reduce){
  body{transition:none}
  .shake,.reveal.is-gem .gembox strong{animation:none}
}
</style>

<canvas id="snow" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" type="button" aria-label="처음으로">만에 하나</button>
    <div class="meta"><span id="puzzleNo"></span> · <span id="dateLabel"></span></div>
  </header>

  <!-- INTRO -->
  <section id="intro" class="qwrap" style="gap:26px">
    <div class="hero">
      <h1>만에 하나</h1>
      <p class="tag">만 명 중 한 명만 떠올릴 답을 찾아, 심해로.</p>
    </div>
    <p class="lede">하루 일곱 문제, 모두에게 같은 문제. 흔한 답은 얕은 물에 머물고, 드문 답일수록 깊이 가라앉습니다. 오늘은 어디까지 내려갈 수 있을까요?</p>
    <ul class="rules">
      <li>문제마다 30초. 답은 하나만 고를 수 있어요.</li>
      <li>목록에 없는 답이면 시간이 남아 있는 동안 다시 입력할 수 있어요.</li>
      <li>오타, 띄어쓰기, 별칭, 한/영 전환 실수(rlacl → 김치)는 자동으로 인식해요.</li>
    </ul>
    <div class="zonescale" id="zoneScale"></div>
    <p class="example" id="example"></p>
    <div class="cta">
      <button class="btn" id="startBtn" type="button">오늘의 잠수 시작</button>
      <button class="link" id="practiceBtn" type="button">연습 모드</button>
    </div>
  </section>

  <!-- PLAY -->
  <section id="play" class="qwrap" style="gap:22px" hidden>
    <div class="hud">
      <div class="steps" id="steps"></div>
      <div class="depth">수심 <b id="depthNow">0</b> m</div>
    </div>
    <div class="qwrap">
      <span class="qno" id="qNo"></span>
      <h2 class="prompt" id="promptText"></h2>
      <p class="hint" id="promptHint"></p>
    </div>
    <div class="timer" id="timer"><i id="timerBar"></i></div>
    <form class="guess" id="guessForm" autocomplete="off">
      <input id="guess" name="guess" type="text" lang="ko" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="답을 입력하세요" aria-label="답">
      <button class="btn" id="submitBtn" type="submit">제출</button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="reveal" id="reveal" hidden>
      <div class="verdict"><span class="chip" id="vChip"></span><span class="pts" id="vPts"></span></div>
      <p class="yours" id="vYours"></p>
      <div class="gembox"><span class="gl">만에 하나</span><strong id="vGem"></strong></div>
      <div class="others" id="vOthers"></div>
      <div><button class="btn" id="nextBtn" type="button">다음 문제</button></div>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="qwrap" style="gap:26px" hidden>
    <div class="result">
      <span class="eyebrow" id="doneLabel">오늘의 잠수</span>
      <p class="bigdepth"><span id="finalDepth">0</span><small>m</small></p>
      <p class="sub" id="finalSub"></p>
      <div class="trench" aria-hidden="true"><i id="trenchBar"></i></div>
    </div>
    <div class="rows" id="rows"></div>
    <div class="share">
      <pre id="shareText"></pre>
      <div class="cta">
        <button class="btn" id="copyBtn" type="button">결과 복사</button>
        <button class="link" id="againBtn" type="button">연습 모드로 더 잠수하기</button>
      </div>
      <p class="msg" id="copyMsg" role="status"></p>
    </div>
    <p class="countdown" id="countdown"></p>
  </section>
</main>

<script src="data/game.js"></script>
<script>
/* =====================================================================
   1. 문제 데이터
   문제와 정답은 data/prompts/*.yaml 에서 만들어진 data/game.js 에서 와요.
   여기서 고치지 말고 YAML 파일을 고친 뒤 pipeline/build.py 를 실행하세요.
   ===================================================================== */
const PROMPTS = ((typeof window !== 'undefined' && window.GAME_DATA) || {prompts: []}).prompts;

/* =====================================================================
   2. 등급과 수심
   ===================================================================== */
const TIERS = [
  {name:'시간 초과', zone:'', range:'', pts:0, bar:'·'},
  {name:'멸치', zone:'표층', range:'0–200 m', pts:10, bar:'▁'},
  {name:'대왕오징어', zone:'중층', range:'200–1,000 m', pts:30, bar:'▃'},
  {name:'초롱아귀', zone:'심층', range:'1,000–4,000 m', pts:60, bar:'▅'},
  {name:'덤보문어', zone:'심해', range:'4,000–7,000 m', pts:85, bar:'▇'},
  {name:'옆새우', zone:'해구 바닥', range:'10,900 m', pts:100, bar:'✦'},
];
const PER_DAY = 7;
const SECONDS = 30;
const MAX_DEPTH = 10935;            // 챌린저 해연: 만점이면 바다의 가장 깊은 곳에 닿아요
const M_PER_PT = MAX_DEPTH / (PER_DAY * 100);
const LAUNCH = '2026-10-27';        // 1회차 날짜 (한국 시간)

/* =====================================================================
   3. 한글 엔진: 자모 분해, 한/영 변환, 퍼지 매칭
   ===================================================================== */
const Hangul = (() => {
  const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
  const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  // 겹모음·겹받침을 실제 자판 입력 순서로 나눔 (ㅘ = ㅗ+ㅏ)
  const SPLIT = {'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ',
    'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};
  const JOIN = {}; for (const [k, v] of Object.entries(SPLIT)) JOIN[v] = k;
  // 두벌식 자판: 영문 상태로 친 글자를 한글 자모로
  const QWERTY = {q:'ㅂ',w:'ㅈ',e:'ㄷ',r:'ㄱ',t:'ㅅ',y:'ㅛ',u:'ㅕ',i:'ㅑ',o:'ㅐ',p:'ㅔ',a:'ㅁ',s:'ㄴ',d:'ㅇ',f:'ㄹ',g:'ㅎ',
    h:'ㅗ',j:'ㅓ',k:'ㅏ',l:'ㅣ',z:'ㅋ',x:'ㅌ',c:'ㅊ',v:'ㅍ',b:'ㅠ',n:'ㅜ',m:'ㅡ',Q:'ㅃ',W:'ㅉ',E:'ㄸ',R:'ㄲ',T:'ㅆ',O:'ㅒ',P:'ㅖ'};

  /** 한 글자씩 자판 입력 단위로 분해: '왜' → 'ㅇㅗㅐ' */
  function keys(str) {
    let out = '';
    for (const ch of str) {
      const c = ch.codePointAt(0) - 0xAC00;
      if (c >= 0 && c < 11172) {
        const cho = Math.floor(c / 588), jung = Math.floor((c % 588) / 28), jong = c % 28;
        out += CHO[cho] + (SPLIT[JUNG[jung]] || JUNG[jung]) + (jong ? (SPLIT[JONG[jong]] || JONG[jong]) : '');
      } else out += SPLIT[ch] || ch;
    }
    return out;
  }

  /** 자모 나열을 글자로 조합 (두벌식 오토마타) */
  function compose(jamos) {
    let out = '', cho = -1, jung = -1, jong = '';
    const isV = j => JUNG.includes(j);
    const flush = () => {
      if (cho >= 0 && jung >= 0) out += String.fromCharCode(0xAC00 + (cho * 21 + jung) * 28 + JONG.indexOf(jong));
      else if (cho >= 0) out += CHO[cho];
      else if (jung >= 0) out += JUNG[jung];
      cho = -1; jung = -1; jong = '';
    };
    for (const j of jamos) {
      if (isV(j)) {
        if (jong) {                       // 받침이 다음 글자 첫소리로 넘어감
          let keep = '', move = jong;
          if (SPLIT[jong]) { keep = SPLIT[jong][0]; move = SPLIT[jong][1]; }
          jong = keep; flush();

   4. 답 인식
   ===================================================================== */
const PARTICLES = ['입니다','이에요','예요','이요','이','가','을','를','은','는','요'];
const len = s => [...s].length;
const norm = s => s.normalize('NFC').trim().toLowerCase()
  .replace(/\([^)]*\)/g, '')
  .replace(/[\s·・.,\-_'"!?~]/g, '');

function prepare(p) {
  p.answers = p.answers.map(a => ({name: a.name, tier: a.tier, aliases: a.aliases || []}));
  p.gem = p.answers.find(a => a.tier === 5);
  const exact = new Map(), fuzzy = [];
  const add = (k, ans, via) => { if (k && !exact.has(k)) exact.set(k, {ans, via}); };
  // 정답 이름을 먼저 등록해서 별칭보다 우선하게
  for (const ans of p.answers) add(norm(ans.name), ans, null);
  for (const ans of p.answers) for (const al of ans.aliases) add(norm(al), ans, al);
  for (const ans of p.answers) {
    for (const f of [ans.name, ...ans.aliases]) {
      const k = norm(f), via = f === ans.name ? null : f;
      fuzzy.push({k, keys: Hangul.keys(k), ans, via, len: len(k)});
      for (const suf of p.strip) {
        if (k.endsWith(suf)) { const s = k.slice(0, -suf.length); if (len(s) >= 2) add(s, ans, via); }
      }
    }
  }
  p.index = {exact, fuzzy};
  return p;
}
PROMPTS.forEach(prepare);

function candidates(raw, p) {
  const out = [];
  const push = (s, how, fuzzyOk) => { if (s == null) return; const k = norm(s); if (k && !out.some(o => o.k === k)) out.push({k, how, fuzzyOk}); };
  push(raw, null, true);
  const compact = raw.replace(/\s/g, '');
  if (/^[A-Za-z]+$/.test(compact)) {
    push(Hangul.fromQwerty(compact), 'qwerty', true);
    // Caps Lock: 'RUDWHD' → 경종 (Shift on purpose gives ㄲ, but all-capitals almost never does)
    if (compact.length > 1 && compact === compact.toUpperCase()) push(Hangul.fromQwerty(compact.toLowerCase()), 'qwerty', true);
  }
  // 조사와 접미사가 함께 붙어도: '강남역이요' → '강남역' → '강남'
  for (let i = 0; i < out.length && out.length < 40; i++) {
    const c = out[i];
    for (const suf of p.strip) if (c.k.endsWith(suf) && len(c.k) > len(suf)) push(c.k.slice(0, -suf.length), c.how, c.fuzzyOk);
    for (const suf of PARTICLES) if (c.k.endsWith(suf) && len(c.k) > len(suf)) push(c.k.slice(0, -suf.length), c.how, false);
  }
  return out;
}

/** 입력을 정답으로 인식. 못 찾으면 null */
function match(raw, p) {
  const cands = candidates(raw, p);
  for (const c of cands) {
    const hit = p.index.exact.get(c.k);
    if (hit) return {ans: hit.ans, via: hit.via, how: c.how, fixed: false};
  }
  let best = null;
  for (const c of cands) {
    if (!c.fuzzyOk || len(c.k) < 2) continue;      // 한 글자 답은 오타 교정 안 함
    const ck = Hangul.keys(c.k);
    for (const f of p.index.fuzzy) {
      if (f.len < 2) continue;
      // 짧은 답은 글자 수가 같아야 해요: '김치'가 '파김치'로 바뀌지 않게
      if (Math.abs(f.len - len(c.k)) > (f.len >= 4 ? 1 : 0)) continue;
      const lim = f.keys.length <= 6 ? 1 : f.keys.length <= 10 ? 2 : 3;
      const d = Hangul.distance(ck, f.keys, lim);
      if (d > lim) continue;
      // 같은 거리면 더 흔한(낮은 등급) 답으로: 애매한 교정이 점수를 부풀리지 않게
      if (!best || d < best.d || (d === best.d && f.ans.tier < best.f.ans.tier)) best = {d, f, how: c.how};
    }
  }
  return best ? {ans: best.f.ans, via: best.f.via, how: best.how, fixed: true} : null;
}

      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.min(120, Math.round(W * H / 14000));
      ps = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .3, v: Math.random() * .22 + .06, a: Math.random() * .45 + .12, p: Math.random() * 6.28}));
      draw(0);
    }
    function draw(t) {
      ctx.clearRect(0, 0, W, H); ctx.fillStyle = color;
      for (const q of ps) {
        if (!reduce) { q.y += q.v; q.x += Math.sin(t / 2200 + q.p) * .12; if (q.y > H + 4) { q.y = -4; q.x = Math.random() * W; } }
        ctx.globalAlpha = q.a; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
      }
    }
    addEventListener('resize', size); size();
    if (!reduce) { const loop = t => { draw(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  })();
})();
