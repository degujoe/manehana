# One question for 만에 하나. Edit this file by hand; everything in data/signals and data/game.* is generated.
# Don't write tiers here: the pipeline calculates them from Wikipedia pageviews and other signals.
# To force a tier for one answer, add `tier:` (1-4) AND a `note:` explaining why.
id: bird
label: "새"
question: "한국에서 볼 수 있는 새를 하나 대 보세요"
hint: "텃새·철새 모두 (닭·거위 같은 가축 제외)"
status: live
strip: []
gem: "물까마귀"
gem_note: "이름과 달리 까마귀가 아니라, 계곡 물속을 걸어 다니며 먹이를 잡는 새예요."
# Typed often but NOT valid. Rejected outright, so the typo fixer can't turn them into a real answer.
# Domestic or caged birds (닭, 거위, 집오리, 칠면조, 오골계, 십자매, 잉꼬, 카나리아, 문조, 앵무새, 공작)
# and birds that don't live wild in Korea (타조, 펭귄, 홍학/플라밍고, 벌새, 키위, 에뮤). 박쥐 is a mammal.
reject: ["닭", "거위", "집오리", "칠면조", "오골계", "십자매", "잉꼬", "카나리아", "문조", "앵무새", "공작", "공작새", "타조", "펭귄", "홍학", "플라밍고", "벌새", "키위", "에뮤", "박쥐"]

# Korean Wikipedia titles to try for each answer, in order. {name} is replaced by the answer.
wiki_titles: ["{name} (새)", "{name} (조류)", "{name}"]
# Words that show an article is about the right topic (also used to pick from disambiguation pages)
# "(새)" / "(조류)" match disambiguation links such as a "매 (새)" entry on the 매 page.
context: ["조류", "철새", "텃새", "나그네새", "과에 속하는", "(새)", "(조류)", "새이다"]
# Use everyday word frequency? false when answers have other meanings (kings, places, surnames)
use_wordfreq: true
# Signal weights for this question (everyday words: nobody looks up 참새 on Wikipedia, so lean on how often it is written)
weights: {mentions: 3, wordfreq: 2, pageviews: 1, sitelinks: 0}

# Anchor pairs: the first answer MUST come out more common than the second, or the update is blocked.
anchors:
  - ["까치", "곤줄박이"]
  - ["참새", "쇠박새"]
  - ["비둘기", "흑비둘기"]
  - ["까마귀", "노랑턱멧새"]

# Where the answer list was checked
sources:
  - https://birdskoreablog.org/wp-content/uploads/2024/08/Birds-Korea-checklist-Kor-2024-final-with-quick-fix-20240827.pdf
  - https://newstomato.com/ReadNews.aspx?no=1303061
  - https://encykorea.aks.ac.kr/Article/E0058670
  - https://www.ytn.co.kr/_ln/0106_201905040336406017

