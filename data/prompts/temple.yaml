# One question for 만에 하나. Edit this file by hand; everything in data/signals and data/game.* is generated.
# Don't write tiers here: the pipeline calculates them from Wikipedia pageviews and other signals.
# To force a tier for one answer, add `tier:` (1-4) AND a `note:` explaining why.
id: temple
label: "절"
question: "한국의 절(사찰)을 하나 대 보세요"
hint: "남한의 절 · 이름에 '사'나 '암'이 붙는 곳"
status: live
strip: []
gem: "운주사"
gem_note: "도선국사가 하룻밤 새 천불천탑을 세웠다는 전설이 있어요."
# Typed often but NOT valid. Rejected outright, so the typo fixer can't turn them into a real answer.
# Famous temples outside Korea (Japan, Cambodia), and 종묘, which is a royal shrine, not a Buddhist temple.
# Not 소림사 / 한산사 / 백마사: small Korean temples share those Chinese names (e.g. 소림사 in 종로구).
reject: ["금각사", "은각사", "법륭사", "앙코르와트", "종묘"]

# Korean Wikipedia titles to try for each answer, in order. {name} is replaced by the answer.
wiki_titles: ["{name}", "{name} (사찰)", "{name} (절)"]
# Words that show an article is about the right topic (also used to pick from disambiguation pages)
context: ["사찰", "절", "불교", "조계종", "천태종", "암자", "본사", "말사"]
# Use everyday word frequency? false when answers have other meanings (kings, places, surnames)
use_wordfreq: false

# Anchor pairs: the first answer MUST come out more common than the second, or the update is blocked.
anchors:
  - ["불국사", "태안사"]
  - ["해인사", "쌍봉사"]
  - ["통도사", "개암사"]
  - ["조계사", "무위사"]

# Where the answer list was checked
sources:
  - https://encykorea.aks.ac.kr/Article/E0023752
  - https://mobile.newsis.com/view/NISX20180702_0000351882
  - https://v.daum.net/v/XDV085x2mQ
  - https://m.cafe.daum.net/tkpolice29/EbYl/53550
  - https://weekly.khan.co.kr/article/202011271552131
  - https://dh.aks.ac.kr/wiki/index.php/%EC%8A%B9%ED%83%91%EB%B9%84%EB%AC%B8_%EA%B8%B0%EC%82%AC_%EB%AA%A9%EB%A1%9D
  - https://sanshin.pages.dev/Top108Temples.html
  - https://en.wikipedia.org/wiki/List_of_Buddhist_temples_in_Seoul
  - https://koreantempleguide.com/category/jeollanam-do/page/3/
  - https://koreantempleguide.com/tag/korean-temple/page/33
  - https://amp.cnn.com/cnn/travel/article/south-korea-beautiful-temples

