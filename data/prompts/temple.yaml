# Hermitages (암) count. 석굴암 is its own answer (a separate national treasure and World Heritage site,
# though administered by 불국사). Famous historic temples known today as sites (황룡사, 미륵사, 감은사,
# 정림사) count too; their "-지" site names are aliases.
