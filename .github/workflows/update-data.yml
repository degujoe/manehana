# Collects rarity signals, scores every answer and runs the accuracy checks.
#
# - Every Monday, on a manual run, or when questions change on main:
#   opens (or updates) a pull request called "Rarity data refresh" with the new tiers.
# - On agent/* branches (used by the background Claude agent): commits the
#   regenerated data back to that branch so the agent can read the report.
#
# The job shows ❌ when a check fails; the full report is on the run's summary page.
name: Update rarity data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: ["main", "agent/**"]
    paths: ["data/prompts/**", "pipeline/**", ".github/workflows/update-data.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyyaml requests wordfreq

      - name: Collect signals (Korean Wikipedia, Wikidata, word frequency)
        run: python pipeline/collect.py

      - name: Score answers and run checks
        id: build
        run: |
          set +e
          python pipeline/build.py
          code=$?
          if [ $code -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          cat data/report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Open a pull request with the new data
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/refresh
          delete-branch: true
          commit-message: Refresh rarity data
          title: ${{ steps.build.outputs.ok == 'true' && 'Rarity data refresh' || 'Rarity data refresh (checks failing)' }}
          body-path: data/summary.md
          add-paths: |
            data/signals/**
            data/game.json
            data/game.js
            data/report.md
            data/summary.md

      - name: Commit generated data to this agent branch
        if: startsWith(github.ref, 'refs/heads/agent/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/signals data/game.json data/game.js data/report.md data/summary.md
          if ! git diff --cached --quiet; then
            git commit -m "Update generated rarity data"
            git push
          fi

      - name: Fail if a check failed
        if: steps.build.outputs.ok != 'true'
        run: |
          echo "::error::Some checks failed. See the summary page or data/report.md."
          exit 1
